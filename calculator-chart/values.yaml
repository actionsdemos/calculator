replicaCount: 3

image:
  repository: calculator-app
  tag: v1
  pullPolicy: Never

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

config:
  APP_ENV: "development"
  APP_NAME: "calculator"

secret:
  existingSecret: calculator-secret

ingress:
  enabled: false
  className: nginx
  host: calculator-helm.local
